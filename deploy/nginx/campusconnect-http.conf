# ---------------------------------------------------------------------------
# CampusConnect — Nginx, stage 1 of 2 (plain HTTP only)
#
# Use this file FIRST. It has no ssl_certificate lines, so `nginx -t` passes
# before any certificate exists. It serves the site over HTTP, which is exactly
# what Certbot needs to prove you own the domain.
#
# Stage 2 (after the certificate is issued) is deploy/nginx/campusconnect.conf.
#
# Install:
#   sudo cp deploy/nginx/campusconnect-http.conf /etc/nginx/sites-available/campusconnect
#   sudo ln -sf /etc/nginx/sites-available/campusconnect /etc/nginx/sites-enabled/campusconnect
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace campusconnect.duckdns.org with your own hostname.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name campusconnect.duckdns.org;

    root /var/www/campusconnect;
    index index.html;

    # Uploads are JSON payloads only.
    client_max_body_size 1m;

    # Compress text assets (the built bundle is ~530 kB raw, ~150 kB gzipped).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Certbot writes its challenge file here. This must stay reachable over
    # plain HTTP even after HTTPS is enabled, or renewal will fail.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # React Router uses client-side routes, so unknown paths fall back to
    # index.html instead of returning a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so assets can be cached for a year.
    # No add_header here on purpose: a location-level add_header would replace
    # the server-level security headers instead of adding to them.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # The Express API listens on loopback only; it is never exposed directly.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
