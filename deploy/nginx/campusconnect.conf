# ---------------------------------------------------------------------------
# CampusConnect — Nginx site configuration
#
# Serves the built Vite frontend from /var/www/campusconnect and proxies /api
# to the Express process on 127.0.0.1:4000. The backend port is never exposed
# publicly: the systemd unit binds to localhost and the firewall only opens
# 22, 80 and 443.
#
# Install:
#   sudo cp deploy/nginx/campusconnect.conf /etc/nginx/sites-available/campusconnect
#   sudo ln -s /etc/nginx/sites-available/campusconnect /etc/nginx/sites-enabled/campusconnect
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace campusconnect.duckdns.org with your own hostname. Certbot rewrites the
# ssl_certificate lines the first time it runs.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name campusconnect.duckdns.org;

    # Certbot needs this path reachable over plain HTTP to issue the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campusconnect.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/campusconnect.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusconnect.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads are JSON payloads only; keep the body limit in step with the API.
    client_max_body_size 1m;

    root /var/www/campusconnect;
    index index.html;

    # --- Frontend ---------------------------------------------------------
    # React Router uses client-side routes, so unknown paths fall back to
    # index.html instead of returning a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Health probes are useful to keep out of access logs.
    location = /api/health/live {
        access_log off;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
}
