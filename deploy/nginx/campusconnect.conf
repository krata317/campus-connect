# ---------------------------------------------------------------------------
# CampusConnect — Nginx, stage 2 of 2 (HTTPS)
#
# Install this file ONLY after Certbot has issued the certificate. Before that
# the ssl_certificate paths do not exist and `nginx -t` fails, which is why
# stage 1 (campusconnect-http.conf) exists.
#
# Install:
#   sudo cp deploy/nginx/campusconnect.conf /etc/nginx/sites-available/campusconnect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace campusconnect.duckdns.org with your own hostname.
#
# Written for the Nginx packaged by Ubuntu 22.04 (1.18) and 24.04 (1.24).
# `listen 443 ssl http2` is used instead of the newer `http2 on;` directive,
# because `http2 on;` only exists in Nginx 1.25.1 and later.
# ---------------------------------------------------------------------------

# Plain HTTP: only the ACME challenge and the redirect to HTTPS live here.
# The ACME location must survive permanently, otherwise `certbot renew` fails
# once the 90-day certificate expires.
server {
    listen 80;
    listen [::]:80;
    server_name campusconnect.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name campusconnect.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/campusconnect.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusconnect.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/campusconnect;
    index index.html;

    # Uploads are JSON payloads only.
    client_max_body_size 1m;

    # Compress text assets (the built bundle is ~530 kB raw, ~150 kB gzipped).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # React Router uses client-side routes, so unknown paths fall back to
    # index.html instead of returning a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so assets can be cached for a year.
    # No add_header here on purpose: a location-level add_header would replace
    # the server-level security headers instead of adding to them.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # The Express API listens on loopback only; it is never exposed directly.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
